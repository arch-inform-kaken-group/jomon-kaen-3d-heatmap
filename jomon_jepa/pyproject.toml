[project]
name = "jomon-multimodal-3d-jepa"
version = "0.1.0"
description = "Multimodal 3D-JEPA with PointTransformerV3 (Sonata/Concerto/Utonia) for Jomon Affective Modeling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "point-transformer-v3>=0.1.0",
    "pytorch-lightning>=2.4.0",
    "open3d>=0.18.0,<0.20.0",
    "trimesh>=4.0.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "accelerate>=1.0.0",
    "sentence-transformers>=3.2.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "japanize-matplotlib",
    "reportlab",
    "Pillow",
    "tqdm",
    "pydub>=0.25.1",
    "soundfile>=0.14.0",
    "faster-whisper>=1.2.1",
    "tensorboard>=2.21.0",
]

[tool.uv]
override-dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true